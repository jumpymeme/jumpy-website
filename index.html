<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JUMPY — JUST JUMP.</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#eef8fc;font-family:Arial,Helvetica,sans-serif}
body{overflow-x:hidden}

#page{
 position:relative;
 width:min(1024px,100vw);
 margin:auto;
 aspect-ratio:1024/1536;
 background:url("jumpy-background.PNG") center/100% 100% no-repeat;
 overflow:hidden;
}

/* REAL GAME */
#game{
 position:absolute;
 left:30%;
 top:17%;
 width:69%;
 height:34%;
 z-index:5;
 pointer-events:none;
}

#canvas{
 width:100%;
 height:100%;
 display:block;
}

/* SCORE */
#score{
 position:absolute;
 top:8.6%;
 left:43%;
 z-index:10;
 font-size:31px;
 font-weight:900;
 color:#091426;
 pointer-events:none;
}

#best{
 position:absolute;
 top:8.6%;
 left:56.8%;
 z-index:10;
 font-size:31px;
 font-weight:900;
 color:#091426;
 pointer-events:none;
}

/* STATUS */
#status{
 position:absolute;
 top:34%;
 right:6%;
 z-index:10;
 font-size:21px;
 font-weight:900;
 color:#091426;
 pointer-events:none;
}

/* INVISIBLE FUNCTION BUTTONS */

#jump{
 position:absolute;
 left:36%;
 top:43.7%;
 width:28%;
 height:5.2%;
 border:0;
 background:transparent;
 border-radius:50px;
 cursor:pointer;
 z-index:20;
}

#again{
 position:absolute;
 left:72%;
 top:41.5%;
 width:24%;
 height:4%;
 border:0;
 background:transparent;
 border-radius:50px;
 cursor:pointer;
 z-index:20;
}

#share{
 position:absolute;
 left:72%;
 top:45.3%;
 width:24%;
 height:4%;
 border:0;
 background:transparent;
 border-radius:50px;
 cursor:pointer;
 z-index:20;
}

#copy{
 position:absolute;
 left:38%;
 top:55.2%;
 width:14%;
 height:4%;
 border:0;
 background:transparent;
 border-radius:50px;
 cursor:pointer;
 z-index:20;
}

/* LINKS */

#x{
 position:absolute;
 left:57%;
 top:54%;
 width:9%;
 height:7%;
 z-index:20;
}

#dex{
 position:absolute;
 left:67%;
 top:54%;
 width:10%;
 height:7%;
 z-index:20;
}

#email{
 position:absolute;
 left:79%;
 top:54%;
 width:19%;
 height:7%;
 z-index:20;
}

#dexButton{
 position:absolute;
 left:6%;
 top:81%;
 width:29%;
 height:4%;
 z-index:20;
}

@media(max-width:600px){
 #page{width:100vw}
 #score,#best{font-size:22px}
 #status{font-size:15px}
}
</style>
</head>

<body>

<div id="page">

<!-- SCORE -->
<div id="score">0</div>
<div id="best">0</div>
<div id="status">GAME OVER</div>

<!-- REAL GAME -->
<div id="game">
<canvas id="canvas"></canvas>
</div>

<!-- GAME BUTTONS -->
<button id="jump"></button>
<button id="again"></button>
<button id="share"></button>

<!-- COPY -->
<button id="copy"></button>

<!-- SOCIAL LINKS -->
<a id="x"
href="https://x.com/jumpymeme"
target="_blank"></a>

<a id="dex"
href="https://dexscreener.com/solana/DPh4Cfctg8yycPZP6zVmhQJZ1tHSvByKAbBLjhLBVitW"
target="_blank"></a>

<a id="email"
href="mailto:jumpymeme@gmail.com"></a>

<a id="dexButton"
href="https://dexscreener.com/solana/DPh4Cfctg8yycPZP6zVmhQJZ1tHSvByKAbBLjhLBVitW"
target="_blank"></a>

</div>


<script>

/* =========================================
   JUMPY CONFIG
========================================= */

const CONTRACT =
"CaWZeUM4FvX9dPkjGc2xHS6tSN3qJfTWyvaG77aM5o7h";

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const game =
document.getElementById("game");

const scoreText =
document.getElementById("score");

const bestText =
document.getElementById("best");

const statusText =
document.getElementById("status");

let W=0;
let H=0;
let dpr=1;

let running=false;
let score=0;

let best=
Number(
localStorage.getItem("jumpyBest") || 0
);

let last=0;
let spawnTimer=0;
let speed=4;

let obstacles=[];

let player={
 x:130,
 y:150,
 w:48,
 h:68,
 vy:0
};


/* =========================================
   RESIZE
========================================= */

function resize(){

 const r=
 game.getBoundingClientRect();

 W=r.width;
 H=r.height;

 dpr=
 Math.min(
   window.devicePixelRatio || 1,
   2
 );

 canvas.width=
 W*dpr;

 canvas.height=
 H*dpr;

 canvas.style.width=
 W+"px";

 canvas.style.height=
 H+"px";

 ctx.setTransform(
   dpr,0,0,dpr,0,0
 );

 if(!running){

   player.x=
   W*.25;

   player.y=
   H*.2;

 }

 draw();
}

window.addEventListener(
"resize",
resize
);


/* =========================================
   RESET
========================================= */

function reset(){

 obstacles=[];

 score=0;

 speed=4;

 spawnTimer=0;

 player.x=
 W*.25;

 player.y=
 H*.25;

 player.vy=0;

 scoreText.textContent="0";

 statusText.textContent=
 "GAME OVER";
}


/* =========================================
   START
========================================= */

function startGame(){

 reset();

 running=true;

 statusText.textContent="";

 jump();

 last=
 performance.now();

 requestAnimationFrame(loop);
}


/* =========================================
   JUMP
========================================= */

function jump(){

 if(!running){

   startGame();

   return;
 }

 player.vy=-10;
}


/* =========================================
   CREATE CANDLE
========================================= */

function createCandle(){

 const height=
 60+
 Math.random()*100;

 obstacles.push({

   x:W+30,

   y:H-25-height,

   width:32,

   height:height,

   color:
     Math.random()>.5
     ? "#18df72"
     : "#ff5151",

   passed:false

 });
}


/* =========================================
   DRAW CANDLE
========================================= */

function drawCandle(o){

 ctx.fillStyle=o.color;

 ctx.strokeStyle="#111";

 ctx.lineWidth=2.5;

 ctx.fillRect(
   o.x,
   o.y,
   o.width,
   o.height
 );

 ctx.strokeRect(
   o.x,
   o.y,
   o.width,
   o.height
 );

 /* top wick */

 ctx.fillRect(
   o.x+12,
   o.y-22,
   5,
   20
 );

 /* bottom wick */

 ctx.fillRect(
   o.x+12,
   o.y+o.height,
   5,
   22
 );
}


/* =========================================
   DRAW JUMPY
========================================= */

function drawJumpy(){

 const x=player.x;
 const y=player.y;

 ctx.save();

 ctx.translate(
   x+player.w/2,
   y+player.h/2
 );

 ctx.rotate(
   player.vy*-.025
 );

 ctx.strokeStyle="#111";
 ctx.lineWidth=2.5;

 /* ROCKET */

 ctx.fillStyle="#8b9298";

 ctx.beginPath();

 ctx.roundRect(
   -43,
   -5,
   27,
   16,
   7
 );

 ctx.fill();
 ctx.stroke();


 /* FLAME */

 ctx.fillStyle="#ffac00";

 ctx.beginPath();

 ctx.moveTo(-43,3);

 ctx.lineTo(-66,-7);

 ctx.lineTo(-59,4);

 ctx.lineTo(-66,15);

 ctx.closePath();

 ctx.fill();
 ctx.stroke();


 /* BODY */

 ctx.fillStyle="#fff";

 ctx.beginPath();

 ctx.roundRect(
   -24,
   -35,
   48,
   70,
   22
 );

 ctx.fill();
 ctx.stroke();


 /* GREEN */

 ctx.save();

 ctx.beginPath();

 ctx.roundRect(
   -24,
   -35,
   48,
   70,
   22
 );

 ctx.clip();

 ctx.fillStyle="#58d63c";

 ctx.fillRect(
   -28,
   7,
   56,
   35
 );

 ctx.restore();


 /* EYES */

 ctx.fillStyle="#111";

 ctx.beginPath();

 ctx.arc(
   -8,
   -8,
   3.5,
   0,
   Math.PI*2
 );

 ctx.arc(
   8,
   -8,
   3.5,
   0,
   Math.PI*2
 );

 ctx.fill();


 /* TONGUE */

 ctx.fillStyle="#f36b85";

 ctx.beginPath();

 ctx.arc(
   0,
   5,
   6,
   0,
   Math.PI
 );

 ctx.fill();


 /* ARMS + LEGS */

 ctx.strokeStyle="#111";

 ctx.lineWidth=3.5;

 ctx.lineCap="round";


 let lines=[

   [-23,2,-42,-10],

   [23,2,42,-11],

   [-11,32,-23,47],

   [11,32,23,46]

 ];


 lines.forEach(
   a=>{

     ctx.beginPath();

     ctx.moveTo(
       a[0],
       a[1]
     );

     ctx.lineTo(
       a[2],
       a[3]
     );

     ctx.stroke();

   }
 );

 ctx.restore();
}


/* =========================================
   COLLISION
========================================= */

function collision(a,b){

 return (

   a.x+8 <
   b.x+b.width &&

   a.x+a.width-8 >
   b.x &&

   a.y+8 <
   b.y+b.height+20 &&

   a.y+a.height-8 >
   b.y

 );

}


/* =========================================
   GAME OVER
========================================= */

function gameOver(){

 running=false;

 statusText.textContent=
 "GAME OVER";

 if(score>best){

   best=score;

   localStorage.setItem(
     "jumpyBest",
     best
   );

   bestText.textContent=
   best;
 }
}


/* =========================================
   DRAW
========================================= */

function draw(){

 ctx.clearRect(
   0,
   0,
   W,
   H
 );

 /* soft clouds */

 ctx.fillStyle=
 "rgba(255,255,255,.28)";

 for(
   let i=0;
   i<5;
   i++
 ){

   let x=
   (i*220)-
   ((score*1.5)%220);

   let y=
   80+
   (i%3)*70;

   ctx.beginPath();

   ctx.ellipse(
     x,
     y,
     90,
     25,
     0,
     0,
     Math.PI*2
   );

   ctx.fill();
 }

 obstacles.forEach(
   drawCandle
 );

 drawJumpy();
}


/* =========================================
   GAME LOOP
========================================= */

function loop(time){

 if(!running){

   draw();

   return;
 }

 const dt=
 Math.min(
   (time-last)/16.67,
   2
 );

 last=time;


 /* gravity */

 player.vy+=
 0.58*dt;

 player.y+=
 player.vy*dt;


 /* ceiling */

 if(player.y<5){

   player.y=5;

   player.vy=0;
 }


 /* ground */

 if(
   player.y+
   player.h>
   H-25
 ){

   gameOver();

   return;
 }


 /* spawn */

 spawnTimer+=dt;

 if(spawnTimer>72){

   createCandle();

   spawnTimer=0;
 }


 /* move candles */

 for(
   let i=obstacles.length-1;
   i>=0;
   i--
 ){

   const o=
   obstacles[i];

   o.x-=
   speed*dt;


   /* score */

   if(
     !o.passed &&
     o.x+o.width<
     player.x
   ){

     o.passed=true;

     score++;

     scoreText.textContent=
     score;

     speed=
     Math.min(
       7,
       4+
       score*.04
     );
   }


   /* collision */

   if(
     collision(
       player,
       o
     )
   ){

     gameOver();

     return;
   }


   /* delete */

   if(
     o.x+o.width<
     -50
   ){

     obstacles.splice(
       i,
       1
     );
   }
 }


 draw();

 requestAnimationFrame(loop);
}


/* =========================================
   BUTTONS
========================================= */

document
.getElementById("jump")
.addEventListener(
 "click",
 jump
);

document
.getElementById("again")
.addEventListener(
 "click",
 startGame
);

document
.getElementById("share")
.addEventListener(
 "click",
 function(){

   const text=
   "I just played JUMPY. JUST JUMP. 🟢";

   window.open(
     "https://twitter.com/intent/tweet?text="+
     encodeURIComponent(text),
     "_blank"
   );
});


/* =========================================
   COPY CA
========================================= */

document
.getElementById("copy")
.addEventListener(
 "click",
 async function(){

   try{

     await navigator.clipboard.writeText(
       CONTRACT
     );

   }catch(e){

     const input=
     document.createElement("input");

     input.value=CONTRACT;

     document.body.appendChild(
       input
     );

     input.select();

     document.execCommand(
       "copy"
     );

     input.remove();
   }

   alert(
     "Contract copied!"
   );
 });


/* =========================================
   KEYBOARD
========================================= */

document.addEventListener(
 "keydown",
 function(e){

   if(
     e.code==="Space" ||
     e.code==="ArrowUp"
   ){

     e.preventDefault();

     jump();
   }
 });


/* =========================================
   TOUCH
========================================= */

canvas.addEventListener(
 "touchstart",
 function(e){

   e.preventDefault();

   jump();

 },
 {passive:false}
);


/* =========================================
   INIT
========================================= */

bestText.textContent=
best;

resize();

</script>

</body>
</html>
