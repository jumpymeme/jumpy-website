<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JUMPY — JUST JUMP.</title>
  <meta
    name="description"
    content="JUMPY — A meme coin for higher places. Built on Solana."
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --bg: #062f5b;
      --bg-2: #05294d;
      --blue: #0877ed;
      --green: #00ef9b;
      --white: #ffffff;
      --muted: #aebfd3;
      --line: rgba(255,255,255,.14);
      --max: 1024px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: white;
      font-family: "Space Grotesk", Arial, sans-serif;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      display: block;
      max-width: 100%;
    }

    .page {
      width: 100%;
      overflow: hidden;
    }

    /* =========================================
       HERO
       ========================================= */

    .hero {
      width: 100%;
      background: #0877ed;
    }

    /*
      JUMPY COVER is the complete hero artwork.
      No duplicate HTML hero text or mascot.
    */

    .hero-art {
      position: relative;
      width: 100%;
      max-width: var(--max);
      margin: 0 auto;
    }

    .hero-art > img {
      width: 100%;
      height: auto;
      display: block;
    }

    /*
      Invisible navigation / button zones.
      They do not change the design visually.
    */

    .hero-link {
      position: absolute;
      z-index: 5;
      display: block;
    }

    .hero-home {
      top: 3%;
      left: 25%;
      width: 6%;
      height: 8%;
    }

    .hero-about {
      top: 3%;
      left: 31%;
      width: 7%;
      height: 8%;
    }

    .hero-memes {
      top: 3%;
      left: 38%;
      width: 7%;
      height: 8%;
    }

    .hero-buy-nav {
      top: 3%;
      left: 44%;
      width: 9%;
      height: 8%;
    }

    .hero-tokenomics {
      top: 3%;
      left: 52%;
      width: 10%;
      height: 8%;
    }

    .hero-community {
      top: 3%;
      left: 62%;
      width: 11%;
      height: 8%;
    }

    .hero-buy-button {
      top: 2.5%;
      right: 14%;
      width: 14%;
      height: 9%;
      border-radius: 50px;
    }

    .hero-x {
      top: 2%;
      right: 8%;
      width: 5%;
      height: 10%;
      border-radius: 50%;
    }

    .hero-dex {
      top: 2%;
      right: 2%;
      width: 5%;
      height: 10%;
      border-radius: 50%;
    }

    /* =========================================
       MAIN
       ========================================= */

    main {
      background:
        linear-gradient(
          180deg,
          #073b70 0%,
          #062f5b 32%,
          #052a50 100%
        );
    }

    .container {
      width: min(var(--max), calc(100% - 80px));
      margin: 0 auto;
    }

    /* =========================================
       MARKET CARD
       ========================================= */

    .market-wrap {
      position: relative;
      z-index: 10;
      margin-top: -38px;
    }

    .market-card {
      min-height: 80px;
      border: 1px solid rgba(104,185,255,.48);
      border-radius: 17px;
      background:
        linear-gradient(
          100deg,
          rgba(4,25,48,.94),
          rgba(3,31,58,.91)
        );
      box-shadow:
        0 18px 45px rgba(0,0,0,.20),
        inset 0 1px 0 rgba(255,255,255,.04);

      display: grid;
      grid-template-columns:
        minmax(230px, 1.7fr)
        minmax(90px, .75fr)
        minmax(80px, .65fr)
        minmax(80px, .65fr)
        minmax(120px, .8fr)
        auto
        46px;

      align-items: center;
      gap: 18px;
      padding: 11px 14px 11px 18px;
    }

    .coin {
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: 0;
    }

    .coin-logo {
      width: 49px;
      height: 49px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid rgba(255,255,255,.35);
      flex-shrink: 0;
    }

    .coin-name {
      min-width: 0;
    }

    .coin-name strong {
      display: block;
      font-size: 17px;
      line-height: 1.1;
      margin-bottom: 5px;
    }

    .coin-name span {
      display: block;
      color: #d5e0eb;
      font-size: 11px;
      white-space: nowrap;
    }

    .market-stat label {
      display: block;
      color: #b5c4d3;
      font-size: 9px;
      text-transform: uppercase;
      margin-bottom: 7px;
    }

    .market-stat strong {
      display: block;
      color: white;
      font-size: 15px;
    }

    .ca {
      min-width: 0;
    }

    .ca label {
      display: block;
      color: #b5c4d3;
      font-size: 9px;
      text-transform: uppercase;
      margin-bottom: 7px;
    }

    .ca-value {
      display: flex;
      align-items: center;
      gap: 5px;
      color: white;
      font-size: 12px;
      white-space: nowrap;
    }

    .copy {
      opacity: .7;
      font-size: 12px;
    }

    .buy-button {
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--green);
      color: #03291b;
      font-size: 12px;
      font-weight: 700;
      padding: 12px 20px;
      min-width: 120px;
      border-radius: 999px;
      white-space: nowrap;
      transition: .2s ease;
    }

    .buy-button:hover {
      transform: translateY(-2px);
    }

    .dots {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.16);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 17px;
      color: white;
    }

    /* =========================================
       FEATURES
       ========================================= */

    .features {
      padding: 35px 0 25px;
    }

    .feature-grid {
      display: grid;
      grid-template-columns:
        repeat(5, 1fr)
        1.05fr;
      align-items: stretch;
    }

    .feature {
      min-height: 110px;
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8px 10px;
    }

    .feature:first-child {
      border-left: none;
    }

    .feature-icon {
      height: 43px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 7px;
      color: #168cff;
      font-size: 34px;
      line-height: 1;
    }

    .feature-title {
      font-size: 13px;
      line-height: 1.2;
      font-weight: 700;
      color: white;
    }

    .feature-note {
      min-height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8px 15px;
    }

    .feature-note-text {
      color: white;
      font-size: 20px;
      line-height: .95;
      font-weight: 700;
      transform: rotate(-7deg);
      position: relative;
    }

    .feature-note-text::after {
      content: "";
      display: block;
      width: 65px;
      height: 4px;
      background: var(--green);
      border-radius: 50%;
      transform: rotate(-10deg);
      margin: 7px auto 0;
    }

    /* =========================================
       MEMES
       ========================================= */

    .memes {
      padding: 12px 0 25px;
    }

    .section-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 11px;
    }

    .section-title {
      display: flex;
      align-items: baseline;
      gap: 15px;
    }

    .section-title h2 {
      font-size: 30px;
      line-height: 1;
      letter-spacing: -.03em;
    }

    .section-title span {
      color: white;
      font-size: 11px;
      opacity: .9;
    }

    .view-all {
      color: #dce8f4;
      font-size: 11px;
    }

    /*
      IMPORTANT:
      Image.PNG is the complete 3x3 MEMES artwork.
      It is NOT repeated nine times.
    */

    .memes-image {
      width: 100%;
      height: auto;
      border-radius: 11px;
      border: 1px solid rgba(110,188,255,.55);
      box-shadow: 0 12px 30
