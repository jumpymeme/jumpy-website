<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>JUMPY — JUST JUMP.</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#eef8ff}
body{font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}
button{font-family:inherit}

#site{
  width:100%;
  max-width:1024px;
  margin:auto;
  position:relative;
  overflow:hidden;
}

/* THE ORIGINAL DESIGN */
.reference{
  width:100%;
  display:block;
  position:relative;
  z-index:1;
}

/* LIVE GAME LAYER */
.game{
  position:absolute;
  z-index:5;
  left:20.5%;
  top:15.2%;
  width:77%;
  height:31.2%;
  pointer-events:none;
}

#gameCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:auto;
  touch-action:none;
}

/*
  Hide the static game objects from the reference.
  The live canvas sits over this area.
*/
.gameCover{
  position:absolute;
  inset:0;
  z-index:1;
  pointer-events:none;
  background:
    linear-gradient(
      to bottom,
      rgba(69,184,239,.94) 0%,
      rgba(102,202,244,.90) 32%,
      rgba(194,232,249,.86) 63%,
      rgba(236,249,255,.72) 100%
    );
  opacity:.88;
  border-radius:10px;
}

/* keep the score area visually clean */
.liveScore{
  position:absolute;
  z-index:10;
  top:0;
  left:50%;
  transform:translateX(-50%);
  width:300px;
  height:80px;
  border-radius:18px;
  background:rgba(255,255,255,.93);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:25px;
  box-shadow:0 8px 25px rgba(0,60,120,.12);
  pointer-events:none;
}

.scorePart{
  text-align:center;
  min-width:75px;
}
.scorePart small{
  display:block;
  font-size:13px;
  color:#101b2a;
  margin-bottom:4px;
}
.scorePart strong{
  display:block;
  font-size:30px;
  line-height:1;
}
.divider{
  width:1px;
  height:48px;
  background:#bccbd6;
}

/* LIVE GAME OVER */
.gameOver{
  position:absolute;
  z-index:20;
  right:0;
  bottom:4%;
  width:270px;
  padding:20px 18px 17px;
  border-radius:22px;
  background:rgba(255,255,255,.94);
  box-shadow:0 10px 35px rgba(0,60,120,.14);
  text-align:center;
  pointer-events:auto;
}

.gameOver.hidden{display:none}

.gameOver h2{
  margin:0 0 20px;
  font-size:21px;
}

.results{
  display:flex;
  justify-content:center;
  gap:25px;
  margin-bottom:18px;
}

.results>div+div{
  border-left:1px solid #ccd7df;
  padding-left:25px;
}

.results small{
  display:block;
  color:#566474;
  margin-bottom:4px;
}

.results strong{
  font-size:27px;
}

.retry,
.share{
  width:100%;
  height:48px;
  border-radius:28px;
  font-size:16px;
  font-weight:800;
}

.retry{
  border:0;
  background:#101d2c;
  color:white;
}

.share{
  margin-top:9px;
  border:1px solid #d8e1e8;
  background:white;
  color:#111;
}

/* LIVE JUMP BUTTON */
.controls{
  position:absolute;
  z-index:20;
  bottom:1%;
  left:50%;
  transform:translateX(-50%);
  text-align:center;
  pointer-events:auto;
}

.jump{
  width:270px;
  height:74px;
  border:0;
  border-radius:40px;
  background:#50eea2;
  color:#07151f;
  font-size:27px;
  font-weight:900;
  box-shadow:0 8px 25px rgba(0,100,80,.16);
}

.jumpArrow{
  font-size:38px;
  vertical-align:-3px;
  margin-right:10px;
}

.hint{
  margin-top:9px;
  font-size:14px;
  color:#526274;
}

/* invisible clickable areas over original buttons/links */
.interaction{
  position:absolute;
  z-index:30;
  cursor:pointer;
}

/* mobile */
@media(max-width:700px){

  #site{
    width:100%;
  }

  .game{
    left:20%;
    top:15.5%;
    width:78%;
    height:31%;
  }

  .liveScore{
    width:250px;
    height:65px;
    gap:16px;
  }

  .scorePart small{
    font-size:11px;
  }

  .scorePart strong{
    font-size:24px;
  }

  .divider{
    height:40px;
  }

  .gameOver{
    width:220px;
    right:2%;
    bottom:5%;
    padding:15px 12px;
  }

  .gameOver h2{
    font-size:18px;
    margin-bottom:15px;
  }

  .results{
    gap:17px;
  }

  .results>div+div{
    padding-left:17px;
  }

  .results strong{
    font-size:22px;
  }

  .retry,.share{
    height:42px;
    font-size:14px;
  }

  .jump{
    width:210px;
    height:56px;
    font-size:21px;
  }

  .jumpArrow{
    font-size:30px;
  }

  .hint{
    font-size:11px;
  }
}
</style>
</head>

<body>

<div id="site">

  <!-- YOUR ORIGINAL REFERENCE IMAGE -->
  <img
    src="jumpy-reference.PNG"
    class="reference"
    alt="JUMPY website"
  >

  <!-- LIVE GAME -->
  <div class="game">

    <div class="gameCover"></div>

    <canvas id="gameCanvas"></canvas>

    <div class="liveScore">
      <div class="scorePart">
        <small>SCORE</small>
        <strong id="score">0</strong>
      </div>

      <div class="divider"></div>

      <div class="scorePart">
        <small>BEST</small>
        <strong>👑 <span id="best">0</span></strong>
      </div>
    </div>

    <div class="gameOver hidden" id="gameOver">

      <h2>GAME OVER</h2>

      <div class="results">
        <div>
          <small>Score</small>
          <strong id="finalScore">0</strong>
        </div>

        <div>
          <small>Best</small>
          <strong>👑 <span id="finalBest">0</span></strong>
        </div>
      </div>

      <button class="retry" id="retry">
        ↻ &nbsp; Try Again
      </button>

      <button class="share" id="share">
        𝕏 &nbsp; Share to X
      </button>

    </div>

    <div class="controls">

      <button class="jump" id="jump">
        <span class="jumpArrow">↑</span>
        JUMP
      </button>

      <div class="hint">
        Press SPACE or click to jump
      </div>

    </div>

  </div>

</div>


<script>

/* =========================================
   JUMPY LIVE GAME
========================================= */

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const gameOverBox = document.getElementById("gameOver");
const finalScoreEl = document.getElementById("finalScore");
const finalBestEl = document.getElementById("finalBest");

let best = Number(localStorage.getItem("jumpy-best") || 0);
bestEl.textContent = best;

let W = 700;
let H = 500;
let dpr = Math.min(window.devicePixelRatio || 1,2);

let player;
let obstacles;
let score;
let running;
let lastTime = 0;
let spawnTimer = 0;
let speed = 210;


/* RESIZE */

function resizeCanvas(){

  const rect = canvas.getBoundingClientRect();

  W = Math.max(300,rect.width);
  H = Math.max(250,rect.height);

  canvas.width = W * dpr;
  canvas.height = H * dpr;

  ctx.setTransform(
    dpr,0,
    0,dpr,
    0,0
  );
}

window.addEventListener("resize",resizeCanvas);
resizeCanvas();


/* RESET */

function resetGame(){

  player = {
    x:W * .30,
    y:H * .48,
    vy:0,
    rotation:0
  };

  obstacles = [];

  score = 0;
  speed = 210;
  spawnTimer = 0;
  running = true;

  scoreEl.textContent = "0";

  gameOverBox.classList.add("hidden");

  /*
    Starting diagonal candle pattern,
    matching the reference.
  */

  for(let i=0;i<7;i++){

    obstacles.push({

      x:W*.55 + i*105,

      y:
        H*.57
        - i*28,

      width:27,
      height:75,

      color:
        i%2===0
        ? "#10c878"
        : "#f04439",

      passed:false
    });
  }
}


/* JUMP */

function jump(){

  if(!running){

    resetGame();
    return;
  }

  player.vy = -430;
}


/* DRAW JUMPY */

function drawJumpy(){

  ctx.save();

  ctx.translate(
    player.x,
    player.y
  );

  ctx.rotate(
    player.rotation
  );

  /*
    flame
  */

  ctx.fillStyle="#ff9d19";

  ctx.beginPath();
  ctx.moveTo(-27,5);
  ctx.lineTo(-53,15);
  ctx.lineTo(-36,-4);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle="#ffe01b";

  ctx.beginPath();
  ctx.moveTo(-29,5);
  ctx.lineTo(-46,11);
  ctx.lineTo(-36,0);
  ctx.closePath();
  ctx.fill();


  /*
    rocket
  */

  ctx.fillStyle="#aeb7bd";

  roundRect(
    -28,
    -14,
    25,
    29,
    7
  );

  ctx.fill();


  /*
    body
  */

  ctx.fillStyle="white";
  ctx.strokeStyle="#101820";
  ctx.lineWidth=3;

  roundRect(
    -20,
    -32,
    40,
    64,
    20
  );

  ctx.fill();
  ctx.stroke();


  /*
    green lower body
  */

  ctx.save();

  ctx.beginPath();

  roundRect(
    -20,
    -32,
    40,
    64,
    20
  );

  ctx.clip();

  ctx.fillStyle="#08b86b";

  ctx.fillRect(
    -24,
    0,
    48,
    35
  );

  ctx.restore();


  /*
    eyes
  */

  ctx.fillStyle="#111";

  ctx.beginPath();

  ctx.arc(
    -7,
    -12,
    3,
    0,
    Math.PI*2
  );

  ctx.arc(
    7,
    -12,
    3,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    mouth
  */

  ctx.strokeStyle="#111";
  ctx.lineWidth=2;

  ctx.beginPath();

  ctx.arc(
    0,
    -5,
    6,
    0,
    Math.PI
  );

  ctx.stroke();


  /*
    arms
  */

  ctx.strokeStyle="#101820";
  ctx.lineWidth=4;
  ctx.lineCap="round";

  ctx.beginPath();

  ctx.moveTo(-17,0);
  ctx.lineTo(-31,9);
  ctx.lineTo(-36,4);

  ctx.moveTo(17,0);
  ctx.lineTo(31,-8);
  ctx.lineTo(35,-14);

  ctx.stroke();


  /*
    legs
  */

  ctx.beginPath();

  ctx.moveTo(-9,28);
  ctx.lineTo(-18,39);
  ctx.lineTo(-23,39);

  ctx.moveTo(9,28);
  ctx.lineTo(18,38);
  ctx.lineTo(23,38);

  ctx.stroke();

  ctx.restore();
}


/* CANDLE */

function drawCandle(o){

  ctx.save();

  /*
    stem
  */

  ctx.strokeStyle=o.color;
  ctx.lineWidth=5;

  ctx.beginPath();

  ctx.moveTo(
    o.x,
    o.y-18
  );

  ctx.lineTo(
    o.x,
    o.y+o.height+18
  );

  ctx.stroke();


  /*
    body
  */

  ctx.fillStyle=o.color;

  roundRect(
    o.x-o.width/2,
    o.y,
    o.width,
    o.height,
    5
  );

  ctx.fill();


  /*
    small highlight
  */

  ctx.fillStyle="rgba(255,255,255,.15)";

  ctx.fillRect(
    o.x-o.width/2+4,
    o.y+5,
    5,
    o.height-10
  );

  ctx.restore();
}


/* PATH */

function drawFlightPath(){

  ctx.save();

  ctx.strokeStyle="rgba(255,255,255,.9)";
  ctx.lineWidth=4;

  ctx.setLineDash([
    14,
    11
  ]);

  ctx.beginPath();

  ctx.moveTo(
    player.x-20,
    player.y+20
  );

  ctx.quadraticCurveTo(
    player.x+100,
    player.y-100,
    player.x+260,
    player.y-25
  );

  ctx.stroke();

  ctx.restore();
}


/* COLLISION */

function collision(o){

  const left =
    o.x-o.width/2;

  const right =
    o.x+o.width/2;

  const top =
    o.y;

  const bottom =
    o.y+o.height;


  return (

    player.x+16 > left &&
    player.x-16 < right &&
    player.y+23 > top &&
    player.y-23 < bottom

  );
}


/* GAME OVER */

function endGame(){

  running=false;

  finalScoreEl.textContent=score;

  if(score>best){

    best=score;

    localStorage.setItem(
      "jumpy-best",
      best
    );
  }

  bestEl.textContent=best;
  finalBestEl.textContent=best;

  gameOverBox.classList.remove("hidden");
}


/* UPDATE */

function update(dt){

  if(!running)return;


  /*
    gravity
  */

  player.vy += 1050 * dt;

  player.y += player.vy * dt;

  player.rotation =
    Math.max(
      -.35,
      Math.min(
        .6,
        player.vy*.0007
      )
    );


  /*
    spawn
  */

  spawnTimer += dt;

  if(spawnTimer > 1.05){

    spawnTimer=0;

    const previous =
      obstacles[obstacles.length-1];

    let y =
      previous
      ? previous.y + (Math.random()-.5)*100
      : H*.5;


    y=Math.max(
      70,
      Math.min(
        H-140,
        y
      )
    );


    obstacles.push({

      x:W+50,

      y:y,

      width:27,

      height:75,

      color:
        Math.random()>.48
        ? "#10c878"
        : "#f04439",

      passed:false
    });
  }


  /*
    move candles
  */

  for(const o of obstacles){

    o.x -= speed*dt;


    /*
      score
    */

    if(
      !o.passed &&
      o.x < player.x-25
    ){

      o.passed=true;

      score++;

      scoreEl.textContent=score;

      speed =
        Math.min(
          340,
          210 + score*4
        );
    }


    /*
      collision
    */

    if(collision(o)){

      endGame();

      return;
    }
  }


  obstacles =
    obstacles.filter(
      o => o.x>-80
    );


  /*
    top / bottom
  */

  if(
    player.y-22<0 ||
    player.y+22>H
  ){

    endGame();
  }
}


/* BACKGROUND */

function drawGameBackground(){

  /*
    transparent game atmosphere
    so the original reference remains visible
  */

  const g =
    ctx.createLinearGradient(
      0,0,
      0,H
    );

  g.addColorStop(
    0,
    "rgba(70,184,240,.20)"
  );

  g.addColorStop(
    .55,
    "rgba(190,231,249,.10)"
  );

  g.addColorStop(
    1,
    "rgba(255,255,255,.02)"
  );

  ctx.fillStyle=g;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );
}


/* DRAW */

function draw(){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );

  drawGameBackground();

  drawFlightPath();

  for(const o of obstacles){
    drawCandle(o);
  }

  drawJumpy();
}


/* LOOP */

function loop(time){

  const dt =
    Math.min(
      .033,
      (time-lastTime)/1000 || 0
    );

  lastTime=time;

  update(dt);
  draw();

  requestAnimationFrame(loop);
}


/* CONTROLS */

document
  .getElementById("jump")
  .addEventListener(
    "click",
    jump
  );


canvas.addEventListener(
  "pointerdown",
  function(e){

    e.preventDefault();
    jump();

  }
);


document.addEventListener(
  "keydown",
  function(e){

    if(
      e.code==="Space" ||
      e.code==="ArrowUp"
    ){

      e.preventDefault();

      jump();
    }

  }
);


/* RETRY */

document
  .getElementById("retry")
  .addEventListener(
    "click",
    resetGame
  );


/* SHARE */

document
  .getElementById("share")
  .addEventListener(
    "click",
    function(){

      const text =
        "I scored "
        +score+
        " on $JUMPY. JUST JUMP. 🚀";

      window.open(
        "https://x.com/intent/post?text="
        +encodeURIComponent(text),
        "_blank"
      );

    }
  );


/* START */

resetGame();

requestAnimationFrame(loop);

</script>

</body>
</html>
